name: Benchmark heartbeat alarm

# Watches the nightly benchmark agent for SILENCE.
#
# The agent's two real failures both exited zero: 147 consecutive nightlies died on a deleted branch
# ref, and a nine-day stretch returned `dry_run` on every poll. Anything triggered by a failing job
# would have missed both. So the alarm condition here is the absence of a fresh heartbeat, not the
# presence of an error.
#
# It runs on GitHub rather than on the box on purpose: "the box is unreachable" is one of the states
# being watched for, and nothing on the box can report its own death. This job touches no host, no
# port and no route -- it reads two files from two branches of this repository.
on:
  schedule:
    # Every 30 minutes against a 60-minute threshold. GitHub's scheduled workflows are best-effort
    # and routinely run late, so the margin absorbs ordinary scheduling jitter.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: benchmark-heartbeat-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate heartbeat freshness
        uses: actions/github-script@v9
        env:
          STALE_AFTER_MINUTES: '60'
          STALE_RESULT_DAYS: '7'
          HEARTBEAT_BRANCH: benchmark-heartbeat
          RESULTS_BRANCH: benchmark-results
        with:
          script: |
            const staleAfterMs = Number(process.env.STALE_AFTER_MINUTES) * 60 * 1000;

            // TWO channels, because these fail for unrelated reasons and demand different responses.
            //
            // OPERATIONAL is "the machinery is broken": no beat, an agent error, a run that died on
            // infrastructure, a runner executing undeployed code. Someone must go fix something.
            //
            // OUTCOME is "the machinery works and the models did not clear the bar". Nothing is
            // broken. The verdict gate is 0.99 over a 100-scenario set, so a configuration is
            // eliminated by its second miss, and nothing has ever qualified.
            //
            // They shared one issue titled "Benchmark agent is not reporting", which was false
            // whenever the only finding was an unmet bar -- the agent reports every five minutes
            // with live progress. A permanently red issue for an expected outcome is how a channel
            // dies: you learn to ignore it, and then it goes unread for a real fault. Splitting
            // suppresses nothing; both still raise, assign and close on their own.
            const CHANNELS = {
              operational: {
                label: 'benchmark-alarm',
                title: 'Benchmark agent is not reporting',
                recovered: 'Recovered — the agent is reporting again.',
                healthy: '- The agent is reporting on schedule.',
              },
              outcome: {
                label: 'benchmark-outcome',
                title: 'Benchmark is not producing a qualifying result',
                recovered: 'Recovered — a qualifying result has been published.',
                healthy: '- Qualification is current.',
              },
            };

            async function readJson(ref, path) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner, repo: context.repo.repo, path, ref,
                });
                return JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            const heartbeat = await readJson(process.env.HEARTBEAT_BRANCH, 'heartbeat.json');

            // Absent branch means the beacon has not been deployed to the box yet. Deliberately not
            // an alarm: it would fire on every schedule between merging this workflow and running
            // the install, which is noise with a known cause. Once deployed the branch is only ever
            // force-updated, never deleted, so this state does not recur silently. The job summary
            // still says so on every run.
            if (!heartbeat) {
              core.summary.addHeading('Heartbeat not deployed', 3);
              core.summary.addRaw(
                `No \`heartbeat.json\` on \`${process.env.HEARTBEAT_BRANCH}\`. The alarm is inert until ` +
                'the box publishes its first beat.',
              );
              await core.summary.write();
              core.notice('Heartbeat branch absent; alarm inert until the agent is deployed.');
              return;
            }

            const publishedAt = Date.parse(heartbeat.publishedAt);
            const ageMs = Date.now() - publishedAt;
            const stale = !Number.isFinite(publishedAt) || ageMs > staleAfterMs;
            const progressAlerts = heartbeat.progress?.alerts ?? [];

            const problems = [];
            const outcomeProblems = [];
            if (stale) {
              const minutes = Number.isFinite(publishedAt) ? Math.round(ageMs / 60000) : 'unknown';
              problems.push(`No heartbeat for ${minutes} minute(s); the threshold is ${process.env.STALE_AFTER_MINUTES}.`);
            }
            if (heartbeat.error) problems.push(`Agent reported an error: ${heartbeat.error}`);
            // "configuration X can no longer qualify" is the benchmark working, not breaking.
            for (const alert of progressAlerts) outcomeProblems.push(alert);

            // TWO different files, and conflating them defeats the check. latest.json is the newest
            // ATTEMPT -- it is rewritten by failures too. latest-success.json is the newest QUALIFYING
            // result, written only when status is completed and qualifies is not false.
            //
            // Reading latest.json for staleness is what this originally did, and it is wrong in the
            // precise case that matters: an agent failing every poll rewrites latest.json constantly,
            // so "last result age" reads as zero while nothing has qualified in weeks. Observed live
            // on 2026-08-23 -- six infrastructure_error results in ninety minutes, latest.json fresh
            // to the minute, latest-success.json absent from the branch entirely.
            const latest = await readJson(process.env.RESULTS_BRANCH, 'latest.json');
            const latestSuccess = await readJson(process.env.RESULTS_BRANCH, 'latest-success.json');
            const succeededAt = latestSuccess?.run?.completedAt
              ? Date.parse(latestSuccess.run.completedAt) : null;
            const resultAgeDays = succeededAt
              ? Math.floor((Date.now() - succeededAt) / 86400000) : null;
            const attemptAgeDays = latest?.run?.completedAt
              ? Math.floor((Date.now() - Date.parse(latest.run.completedAt)) / 86400000) : null;

            // The newest attempt failing is worth saying on its own. It is not the same finding as
            // qualification going stale, and it arrives days earlier.
            if (latest && latest.run?.status !== 'completed') {
              const reasons = latest.failures?.infrastructure?.reasons ?? [];
              problems.push(
                `The most recent run ended in \`${latest.run?.status}\`` +
                `${reasons.length ? `: ${reasons.join('; ')}` : ''}.`,
              );
            }

            // Runs are change-triggered, so a few quiet days are legitimate and alarming on them would
            // cry wolf. A week is not: it is the shape of the nine-day dry_run stall, where the agent
            // polled healthily and produced nothing, and no heartbeat check could have caught it
            // because the heartbeat itself was perfectly fresh the entire time.
            const staleResultDays = Number(process.env.STALE_RESULT_DAYS);
            const dryRunNote = heartbeat.dryRun
              ? ' The agent is pinned to dry-run, so it will never produce one.' : '';
            if (resultAgeDays !== null && resultAgeDays >= staleResultDays) {
              outcomeProblems.push(
                `No qualifying benchmark result for ${resultAgeDays} day(s); the threshold is ` +
                `${staleResultDays}.${dryRunNote}`,
              );
            } else if (resultAgeDays === null && latest) {
              // Attempts exist but nothing has ever qualified. Distinguished from a genuinely fresh
              // repository, where latest.json is absent too and firing would be noise.
              outcomeProblems.push(
                'No qualifying benchmark result has ever been published, though runs are being '
                + `attempted (newest attempt \`${latest.run?.status}\`).${dryRunNote}`,
              );
            }

            // DEPLOYMENT DRIFT. The box runs an installed FILE COPY of the agent, not a checkout, so
            // merging to main updates the source it checks out per run and never the agent itself.
            // Both states are then true at once and look contradictory: the preflight passes with
            // your new test while the code that spawned it is weeks old. Observed 2026-08-23 —
            // PR #97 merged, preflight green at 433/433, and the identical infrastructure_error
            // kept publishing until the package was reinstalled by hand.
            //
            // Comparing the installed commit to main's HEAD directly would fire on every unrelated
            // merge, so it asks the only question that matters: has anything under the tool's own
            // directory changed since the copy was taken? Silent when main races ahead elsewhere.
            const installedCommit = heartbeat.agent?.installedCommit ?? null;
            const toolPath = 'tools/remote-ollama-control';
            let agentDrift = null;
            if (installedCommit) {
              try {
                // Ask ancestry, not file lists. The obvious check -- diff the installed commit
                // against the branch head and look for changed files under the tool path -- has a
                // silent hole: the compare endpoint returns at most 300 files, so a badly stale box
                // whose diff is mostly elsewhere can report zero tool changes and no alarm. That is
                // precisely the box that most needs one.
                //
                // Instead: find the newest commit that touched this tool, then ask whether the
                // installed copy already contains it. `behind`/`identical` means yes. `ahead` or
                // `diverged` means the runner is missing tool work, whatever the size of the diff.
                const { data: toolCommits } = await github.rest.repos.listCommits({
                  owner: context.repo.owner, repo: context.repo.repo,
                  sha: context.payload.repository.default_branch, path: toolPath, per_page: 1,
                });
                const toolCommit = toolCommits[0]?.sha ?? null;
                if (toolCommit) {
                  const { data: rel } = await github.rest.repos.compareCommitsWithBasehead({
                    owner: context.repo.owner, repo: context.repo.repo,
                    basehead: `${installedCommit}...${toolCommit}`,
                  });
                  if (rel.status === 'ahead' || rel.status === 'diverged') {
                    agentDrift = { toolCommit, behindBy: rel.ahead_by };
                    problems.push(
                      `The runner is executing agent code from \`${installedCommit.slice(0, 12)}\`, which ` +
                      `does not contain \`${toolCommit.slice(0, 12)}\` — the newest change to ` +
                      `\`${toolPath}\` (${rel.ahead_by} commit(s) ahead). A merge does NOT update the ` +
                      'installed copy: reinstall it, or the agent keeps running the old logic while ' +
                      'its preflight tests the new.',
                    );
                  }
                }
              } catch (error) {
                // An unknown commit (force-pushed away, or a box installed from a fork) must not
                // fail the alarm: losing liveness detection to answer a staleness question is a bad
                // trade. Say it and move on.
                problems.push(`Could not compare the installed agent commit \`${installedCommit}\`: ${error.message}`);
              }
            } else if (heartbeat.agent === null) {
              core.notice('Heartbeat carries no agent provenance; the runner predates install-manifest reporting.');
            }

            const progress = heartbeat.progress;
            const lines = [
              `- **Status**: \`${heartbeat.status}\`${heartbeat.dryRun ? ' (dry-run: no benchmark will execute)' : ''}`,
              `- **Heartbeat age**: ${Math.round(ageMs / 60000)} minute(s)`,
              `- **Source commit**: \`${heartbeat.source?.commit?.slice(0, 12) ?? 'unknown'}\``,
              `- **Last attempt**: ${latest?.run?.id ?? 'none'} — \`${latest?.run?.status ?? 'n/a'}\`${attemptAgeDays === null ? '' : ` (${attemptAgeDays} day(s) ago)`}`,
              `- **Last qualifying result**: ${latestSuccess?.run?.id ?? 'none ever'}${resultAgeDays === null ? '' : ` (${resultAgeDays} day(s) ago)`}`,
              `- **Installed agent**: ${installedCommit ? `\`${installedCommit.slice(0, 12)}\`` : 'unreported'}` +
                `${heartbeat.agent?.installedAt ? ` (installed ${heartbeat.agent.installedAt})` : ''}` +
                `${agentDrift ? ` — **stale by ${agentDrift.behindBy} commit(s); reinstall**` : ''}`,
            ];
            if (progress) {
              const attempts = progress.attempts ?? {};
              const hours = (ms) => (ms == null ? 'unknown' : `${(ms / 3600000).toFixed(1)}h`);
              lines.push(
                `- **Attempts**: ${attempts.recorded} recorded (floor ${attempts.floor}, ceiling ${attempts.ceiling})`,
                `- **Elapsed**: ${hours(progress.elapsedMs)}, throughput ${progress.performance?.attemptsPerHour ?? '?'} /h`,
                `- **ETA**: ${hours(progress.performance?.etaFloorMs)} to ${hours(progress.performance?.etaCeilingMs)} remaining`,
                `- **Quality**: score ${progress.overall?.averageScore}, tool-call ${progress.overall?.toolCallRate}, verdict ${progress.overall?.scenarioVerdictRate}`,
              );
              for (const configuration of progress.configurations ?? []) {
                lines.push(
                  `  - \`${configuration.configurationId}\`: ${configuration.attempts} attempt(s), ` +
                  `score ${configuration.averageScore}, tool-call ${configuration.toolCallRate}` +
                  `${configuration.canStillQualify ? '' : ' — **cannot still qualify**'}`,
                );
              }
            }

            // GitHub notifies on issue CREATION and on comments, never on a body edit. Since an
            // ongoing condition is reported by editing one issue, a genuinely NEW problem that
            // arrives while that issue is already open used to land in silence -- the box could die
            // tonight and fold into an issue open for something else, notifying nobody.
            //
            // So the body carries the problem set it was last written with, and a comment goes out
            // only when that SET changes. Not every run: at a 30-minute cadence a comment per check
            // would bury the signal it exists to raise, which is why body-editing was chosen in the
            // first place. Changes only.
            const SET_OPEN = '<!-- ak-problem-set:';
            const SET_CLOSE = '-->';

            // Stored and compared in the same capped, whitespace-collapsed form, so one enormous
            // error string cannot push the marker past the body limit and so the comparison cannot
            // drift between what was written and what is read back.
            const capProblem = (text) => String(text).replace(/\s+/g, ' ').trim().slice(0, 300);

            function readProblemSet(body) {
              const start = (body || '').indexOf(SET_OPEN);
              if (start === -1) return null;
              const end = body.indexOf(SET_CLOSE, start);
              if (end === -1) return null;
              try {
                const parsed = JSON.parse(body.slice(start + SET_OPEN.length, end).trim());
                return Array.isArray(parsed) ? parsed : null;
              } catch {
                return null;
              }
            }

            function compose(channel, findings) {
              const marker = JSON.stringify(findings.map(capProblem).sort());
              return [
                findings.length ? '## Problems' : '## Healthy',
                ...(findings.length ? findings.map((problem) => `- ${problem}`) : [channel.healthy]),
                '',
                '## Detail',
                ...lines,
                '',
                `_Checked ${new Date().toISOString()} by ${context.workflow}._`,
                `${SET_OPEN} ${marker} ${SET_CLOSE}`,
              ].join('\n');
            }

            async function syncIssue(channel, findings) {
              const body = compose(channel, findings);
              const { data: open } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: channel.label,
              });
              const existing = open.find((issue) => issue.title === channel.title) ?? null;

              if (findings.length === 0) {
                if (existing) {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                    body: `${channel.recovered}\n\n${body}`,
                  });
                  await github.rest.issues.update({
                    owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number,
                    state: 'closed', state_reason: 'completed',
                  });
                }
                return;
              }

              if (!existing) {
                const { data: created } = await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: channel.title, body, labels: [channel.label],
                });
                // Creation is the notification, but only for someone already watching the
                // repository. An unassigned bot-authored issue is easy to never see, and the whole
                // mechanism is built for the case where nobody is looking. Assignment notifies
                // regardless of watch settings. Separate call and non-fatal on purpose: an owner who
                // cannot be assigned (an org without the repo-owner as a member, a renamed account)
                // must degrade to the issue existing unassigned, never to the alarm failing to raise.
                try {
                  await github.rest.issues.addAssignees({
                    owner: context.repo.owner, repo: context.repo.repo,
                    issue_number: created.number, assignees: [context.repo.owner],
                  });
                } catch (error) {
                  core.warning(`Raised #${created.number} but could not assign ${context.repo.owner}: ${error.message}`);
                }
                return;
              }

              // Editing the body rather than commenting: at a 30-minute cadence a comment per check
              // would bury the signal it exists to raise. The issue always shows current state, and
              // its creation was the notification -- except when the set of problems has changed,
              // which is a new thing to know and gets a comment of its own.
              const previous = readProblemSet(existing.body);
              const current = findings.map(capProblem).sort();
              const changed = previous !== null
                && JSON.stringify(previous) !== JSON.stringify(current);

              if (changed) {
                const before = new Set(previous);
                const after = new Set(current);
                const added = current.filter((problem) => !before.has(problem));
                const gone = previous.filter((problem) => !after.has(problem));
                const parts = ['**The problem set changed.**', ''];
                if (added.length) {
                  parts.push('Newly reported:', ...added.map((problem) => `- ${problem}`), '');
                }
                if (gone.length) {
                  parts.push('No longer reported:', ...gone.map((problem) => `- ${problem}`), '');
                }
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.number, body: parts.join('\n'),
                });
              }
              // previous === null means this issue predates the marker. Write the baseline silently
              // rather than announcing every existing problem as though it just appeared.

              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body,
              });
            }

            core.summary.addRaw(compose(CHANNELS.operational, problems));
            if (outcomeProblems.length) {
              core.summary.addRaw(`\n\n---\n\n${compose(CHANNELS.outcome, outcomeProblems)}`);
            }
            await core.summary.write();

            // Sequential, not concurrent: both may create an issue, and interleaving their
            // list/create calls risks each missing the other's work on a shared label page.
            await syncIssue(CHANNELS.operational, problems);
            await syncIssue(CHANNELS.outcome, outcomeProblems);
